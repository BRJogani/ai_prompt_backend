name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: mongodb+srv://test:test@cluster0.imjifqz.mongodb.net/ai_prompt_app_test?retryWrites=true&w=majority&appName=Cluster0
      JWT_ACCESS_SECRET: ci-test-access-secret-not-for-production-use
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production-use

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
