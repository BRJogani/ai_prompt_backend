version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_prompt_app_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_prompt_app
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: build
    container_name: ai_prompt_app_api
    restart: unless-stopped
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
    ports:
      - '4000:4000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_prompt_app?schema=public
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
